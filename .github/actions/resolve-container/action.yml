name: 'Resolve Container Image'
description: 'Assemble a container image name from ci-config.env settings'

inputs:
  compiler:
    description: 'Compiler family (gcc, nvhpc, oneapi)'
    required: true
  mpi:
    description: 'MPI implementation (openmpi, mpich)'
    required: true
  gpu:
    description: 'GPU variant (empty string, or "cuda")'
    required: false
    default: ''

outputs:
  image:
    description: 'Fully qualified container image name'
    value: ${{ steps.resolve.outputs.image }}
  container-prefix:
    description: 'Image prefix (everything before {compiler}-{mpi})'
    value: ${{ steps.resolve.outputs.container-prefix }}
  container-suffix:
    description: 'Image suffix (everything after {compiler}-{mpi})'
    value: ${{ steps.resolve.outputs.container-suffix }}
  compiler-name:
    description: 'Compiler name as it appears in the container image tag'
    value: ${{ steps.resolve.outputs.compiler-name }}
  compiler-map:
    description: 'JSON object mapping compiler families to image compiler names'
    value: ${{ steps.resolve.outputs.compiler-map }}
  mpi-name:
    description: 'MPI name as it appears in the container image tag'
    value: ${{ steps.resolve.outputs.mpi-name }}
  mpi-map:
    description: 'JSON object mapping canonical MPI names to image MPI names'
    value: ${{ steps.resolve.outputs.mpi-map }}

runs:
  using: 'composite'
  steps:
    - name: Resolve container image
      id: resolve
      shell: bash
      run: |
        CI_CONFIG="${GITHUB_WORKSPACE}/.github/ci-config.env"
        if [ ! -f "${CI_CONFIG}" ]; then
          echo "::error::ci-config.env not found at ${CI_CONFIG}"
          exit 1
        fi
        source "${CI_CONFIG}"

        STYLE="${CONTAINER_STYLE}"
        REGISTRY="${CONTAINER_REGISTRY}"
        OS="${CONTAINER_OS}"
        COMPILER="${{ inputs.compiler }}"
        MPI="${{ inputs.mpi }}"
        GPU="${{ inputs.gpu }}"

        # Resolve compiler name for this style
        VARNAME="CONTAINER_COMPILER_${STYLE}_${COMPILER}"
        COMPILER_NAME="${!VARNAME}"
        if [ -z "${COMPILER_NAME}" ]; then
          echo "::error::No container compiler mapping for ${VARNAME}. Add it to .github/ci-config.env"
          exit 1
        fi

        # Resolve MPI name for this style
        VARNAME="CONTAINER_MPI_${STYLE}_${MPI}"
        MPI_NAME="${!VARNAME}"
        if [ -z "${MPI_NAME}" ]; then
          echo "::error::No container MPI mapping for ${VARNAME}. Add it to .github/ci-config.env"
          exit 1
        fi

        # Build compiler map JSON (all families for this style)
        CMAP="{"
        for family in gcc nvhpc oneapi; do
          VARNAME="CONTAINER_COMPILER_${STYLE}_${family}"
          NAME="${!VARNAME}"
          if [ -n "${NAME}" ]; then
            [ "${CMAP}" != "{" ] && CMAP="${CMAP},"
            CMAP="${CMAP}\"${family}\":\"${NAME}\""
          fi
        done
        CMAP="${CMAP}}"

        # Build MPI map JSON (all implementations for this style)
        MMAP="{"
        for impl in openmpi mpich; do
          VARNAME="CONTAINER_MPI_${STYLE}_${impl}"
          NAME="${!VARNAME}"
          if [ -n "${NAME}" ]; then
            [ "${MMAP}" != "{" ] && MMAP="${MMAP},"
            MMAP="${MMAP}\"${impl}\":\"${NAME}\""
          fi
        done
        MMAP="${MMAP}}"

        GPU_PART=""
        if [ -n "${GPU}" ]; then
          GPU_PART="-${GPU}"
        fi

        # Assemble prefix and suffix based on style
        case "${STYLE}" in
          cisldev)
            PREFIX="${REGISTRY}/cisldev-x86_64-${OS}"
            SUFFIX="${GPU_PART}:${CONTAINER_CISLDEV_TAG}"
            ;;
          hpcdev)
            PREFIX="${REGISTRY}/hpcdev-x86_64:${OS}"
            SUFFIX="${GPU_PART}-${CONTAINER_HPCDEV_VERSION}"
            ;;
          *)
            echo "::error::Unknown CONTAINER_STYLE=${STYLE}. Use 'cisldev' or 'hpcdev'."
            exit 1
            ;;
        esac

        IMAGE="${PREFIX}-${COMPILER_NAME}-${MPI_NAME}${SUFFIX}"

        echo "Resolved container image: ${IMAGE}"
        echo "  Style:    ${STYLE}"
        echo "  Compiler: ${COMPILER} → ${COMPILER_NAME}"
        echo "  MPI:      ${MPI} → ${MPI_NAME}"
        echo "  GPU:      ${GPU:-none}"

        echo "image=${IMAGE}" >> $GITHUB_OUTPUT
        echo "container-prefix=${PREFIX}" >> $GITHUB_OUTPUT
        echo "container-suffix=${SUFFIX}" >> $GITHUB_OUTPUT
        echo "compiler-name=${COMPILER_NAME}" >> $GITHUB_OUTPUT
        echo "compiler-map=${CMAP}" >> $GITHUB_OUTPUT
        echo "mpi-name=${MPI_NAME}" >> $GITHUB_OUTPUT
        echo "mpi-map=${MMAP}" >> $GITHUB_OUTPUT
