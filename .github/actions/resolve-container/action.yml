name: 'Resolve Container Image'
description: 'Assemble a container image name from ci-config.env templates'

inputs:
  compiler:
    description: 'Compiler family (gcc, nvhpc, oneapi)'
    required: true
  mpi:
    description: 'MPI implementation (openmpi, mpich)'
    required: true
  gpu:
    description: 'GPU variant (empty string, or "cuda")'
    required: false
    default: ''

outputs:
  image:
    description: 'Fully qualified container image name'
    value: ${{ steps.resolve.outputs.image }}
  container-prefix:
    description: 'Image prefix (everything before {compiler}-{mpi})'
    value: ${{ steps.resolve.outputs.container-prefix }}
  container-suffix:
    description: 'Image suffix (everything after {compiler}-{mpi}, excludes GPU for matrix use)'
    value: ${{ steps.resolve.outputs.container-suffix }}
  container-gpu-suffix:
    description: 'Image suffix for GPU containers'
    value: ${{ steps.resolve.outputs.container-gpu-suffix }}
  compiler-name:
    description: 'Compiler name as it appears in the container image tag'
    value: ${{ steps.resolve.outputs.compiler-name }}
  compiler-map:
    description: 'JSON object mapping compiler families to image compiler names'
    value: ${{ steps.resolve.outputs.compiler-map }}
  mpi-name:
    description: 'MPI name as it appears in the container image tag'
    value: ${{ steps.resolve.outputs.mpi-name }}
  mpi-map:
    description: 'JSON object mapping canonical MPI names to image MPI names'
    value: ${{ steps.resolve.outputs.mpi-map }}

runs:
  using: 'composite'
  steps:
    - name: Resolve container image
      id: resolve
      shell: bash
      run: |
        CI_CONFIG="${GITHUB_WORKSPACE}/.github/ci-config.env"
        if [ ! -f "${CI_CONFIG}" ]; then
          echo "::error::ci-config.env not found at ${CI_CONFIG}"
          exit 1
        fi
        source "${CI_CONFIG}"

        COMPILER="${{ inputs.compiler }}"
        MPI="${{ inputs.mpi }}"
        GPU="${{ inputs.gpu }}"

        # Resolve compiler name (fallback to raw value if no mapping)
        comp_var="CONTAINER_COMPILER_${COMPILER}"
        COMPILER_NAME="${!comp_var:-$COMPILER}"

        # Resolve MPI name: compiler-specific mapping takes priority, then generic, then raw value
        mpi_compiler_var="CONTAINER_MPI_${COMPILER}_${MPI}"
        mpi_var="CONTAINER_MPI_${MPI}"
        MPI_NAME="${!mpi_compiler_var:-${!mpi_var:-$MPI}}"

        # Pick template: compiler-specific override > GPU template > default
        compiler_image_var="CONTAINER_IMAGE_${COMPILER}"
        if [ -n "${!compiler_image_var}" ] && [ -z "${GPU}" ]; then
          TEMPLATE="${!compiler_image_var}"
        elif [ -n "${GPU}" ] && [ -n "${CONTAINER_IMAGE_GPU}" ]; then
          TEMPLATE="${CONTAINER_IMAGE_GPU}"
        else
          TEMPLATE="${CONTAINER_IMAGE}"
        fi

        # Substitute placeholders
        IMAGE="${TEMPLATE//\{compiler\}/$COMPILER_NAME}"
        IMAGE="${IMAGE//\{mpi\}/$MPI_NAME}"

        # Extract prefix (everything before -{compiler}) and suffix
        # (everything after {mpi}) from the resolved template for matrix use
        PREFIX=$(echo "${TEMPLATE}" | sed 's/-{compiler}.*//')
        SUFFIX=$(echo "${TEMPLATE}" | sed 's/.*{mpi}//')
        GPU_SUFFIX=$(echo "${CONTAINER_IMAGE_GPU}" | sed 's/.*{mpi}//')

        # Build compiler map JSON
        CMAP="{"
        for family in gcc nvhpc oneapi; do
          comp_var="CONTAINER_COMPILER_${family}"
          NAME="${!comp_var:-$family}"
          [ "${CMAP}" != "{" ] && CMAP="${CMAP},"
          CMAP="${CMAP}\"${family}\":\"${NAME}\""
        done
        CMAP="${CMAP}}"

        # Build MPI map JSON (compiler-specific mappings take priority)
        MMAP="{"
        for impl in openmpi mpich; do
          mpi_compiler_var="CONTAINER_MPI_${COMPILER}_${impl}"
          mpi_var="CONTAINER_MPI_${impl}"
          NAME="${!mpi_compiler_var:-${!mpi_var:-$impl}}"
          [ "${MMAP}" != "{" ] && MMAP="${MMAP},"
          MMAP="${MMAP}\"${impl}\":\"${NAME}\""
        done
        MMAP="${MMAP}}"

        echo "Resolved container image: ${IMAGE}"
        echo "  Template:  ${TEMPLATE}"
        echo "  Compiler:  ${COMPILER} → ${COMPILER_NAME}"
        echo "  MPI:       ${MPI} → ${MPI_NAME}"
        echo "  GPU:       ${GPU:-none}"
        echo "  Prefix:    ${PREFIX}"
        echo "  Suffix:    ${SUFFIX}"

        echo "image=${IMAGE}" >> $GITHUB_OUTPUT
        echo "container-prefix=${PREFIX}" >> $GITHUB_OUTPUT
        echo "container-suffix=${SUFFIX}" >> $GITHUB_OUTPUT
        echo "container-gpu-suffix=${GPU_SUFFIX}" >> $GITHUB_OUTPUT
        echo "compiler-name=${COMPILER_NAME}" >> $GITHUB_OUTPUT
        echo "compiler-map=${CMAP}" >> $GITHUB_OUTPUT
        echo "mpi-name=${MPI_NAME}" >> $GITHUB_OUTPUT
        echo "mpi-map=${MMAP}" >> $GITHUB_OUTPUT
