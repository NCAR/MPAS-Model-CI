# BFB on GPU: same OpenACC/CUDA build, different MPI rank counts (decomposition).
# CIRRUS self-hosted runners — trigger via workflow_dispatch only (see _test-gpu.yml).

name: "BFB: Decomposition GPU (1 vs 4 ranks)"

on:
  workflow_dispatch:
    inputs:
      gpu_aware_mpi:
        description: 'Use GPU-aware MPI halo exchanges on the GPU (OpenACC) runs. Needs CUDA-enabled MPI in the container; set false to fall back to host-staged halos.'
        required: false
        type: boolean
        default: true

jobs:
  test:
    uses: ./.github/workflows/_test-bfb.yml
    with:
      gpu-aware-mpi: ${{ inputs.gpu_aware_mpi }}
      compiler: nvhpc
      mpi: mpich
      gpu: 'true'
      precision: single
      run-timeout: '20'
      variants: >-
        [{"id":"r1","ranks":1,"label":"1 rank"},
         {"id":"r4","ranks":4,"label":"4 ranks"}]
