# BFB: OpenMP + OpenACC build (NVHPC). Reference is 1 rank x 1 thread; compared against
# 4 ranks x 1 thread (decomposition) and 1 rank x 4 threads (threading, including
# concurrent OpenACC kernel launches from several host threads).
# CIRRUS self-hosted runners -- workflow_dispatch only (see _test-gpu.yml).

name: "BFB: OpenMP+OpenACC (ranks and threads)"

on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/_test-bfb.yml
    with:
      compiler: nvhpc
      mpi: mpich
      gpu: 'true'
      precision: single
      run-timeout: '20'
      variants: >-
        [{"id":"r1","ranks":1,"openmp":true,"omp_threads":1,"label":"OpenMP+OpenACC, 1 rank"},
         {"id":"r4","ranks":4,"openmp":true,"omp_threads":1,"label":"OpenMP+OpenACC, 4 ranks"},
         {"id":"r1-t4","ranks":1,"openmp":true,"omp_threads":4,"label":"OpenMP+OpenACC, 1 rank, 4 threads"}]
