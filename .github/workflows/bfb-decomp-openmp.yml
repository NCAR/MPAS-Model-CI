# BFB: OpenMP build (NVHPC, no OpenACC). Reference is 1 rank x 1 thread; compared against
# 4 ranks x 1 thread (decomposition) and 1 rank x 4 threads (threading).
# Also confirms the OpenMP build succeeds and the model reports the expected thread count.

name: "BFB: OpenMP (ranks and threads)"

on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/_test-bfb.yml
    with:
      compiler: nvhpc
      mpi: mpich
      precision: single
      run-timeout: '20'
      variants: >-
        [{"id":"r1","ranks":1,"openmp":true,"omp_threads":1,"label":"OpenMP, 1 rank"},
         {"id":"r4","ranks":4,"openmp":true,"omp_threads":1,"label":"OpenMP, 4 ranks"},
         {"id":"r1-t4","ranks":1,"openmp":true,"omp_threads":4,"label":"OpenMP, 1 rank, 4 threads"}]
