# BFB on GPU: two I/O builds (SMIOL vs PIO), same MPI rank count.
# CIRRUS self-hosted runners — trigger via workflow_dispatch only (see _test-gpu.yml).

name: "BFB: I/O GPU (SMIOL vs PIO)"

on:
  workflow_dispatch:
    inputs:
      gpu_aware_mpi:
        description: 'Use GPU-aware MPI halo exchanges on the GPU (OpenACC) runs. Needs CUDA-enabled MPI in the container; set false to fall back to host-staged halos.'
        required: false
        type: boolean
        default: true

jobs:
  test:
    uses: ./.github/workflows/_test-bfb.yml
    with:
      gpu-aware-mpi: ${{ inputs.gpu_aware_mpi }}
      compiler: nvhpc
      mpi: mpich
      gpu: 'true'
      precision: single
      run-timeout: '20'
      variants: >-
        [{"id":"smiol-r4","ranks":4,"label":"SMIOL, 4 ranks"},
         {"id":"pio-r4","use_pio":true,"ranks":4,"label":"PIO, 4 ranks"}]
