# BUILD: GNU + Open MPI (CPU)
# Builds the atmosphere and init_atmosphere cores with SMIOL.

name: "BUILD: GNU + Open MPI (CPU)"

on:
  workflow_dispatch:
  push:
    branches: [master, example/a-gcc-openmpi]  # TEMP: remove example branch before merge
  pull_request:
    branches: [develop]

jobs:
  build:
    uses: ./.github/workflows/_build-compiler.yml
    with:
      compiler: gcc
      mpi: openmpi
