name: Debug hpcdev MPI
on:
  push:
    branches: [feature-ci-cleanup]
    paths:
      - '.github/workflows/debug-hpcdev-mpi.yml'

jobs:
  hpcdev:
    name: hpcdev oneapi-openmpi
    runs-on: ubuntu-latest
    container:
      image: docker.io/ncarcisl/hpcdev-x86_64:almalinux9-oneapi-openmpi-26.02
    steps:
      - name: Compiler and preprocessor info
        shell: bash
        run: |
          set +e
          source /container/config_env.sh 2>/dev/null
          echo "=== Intel compiler version ==="
          ifx --version 2>&1 || ifort --version 2>&1 || echo "neither found"
          echo
          echo "=== which ifx/ifort ==="
          which ifx 2>&1; which ifort 2>&1
          echo
          echo "=== mpifort -show ==="
          mpifort -show 2>&1 || true
          echo
          echo "=== mpifort --version ==="
          mpifort --version 2>&1 || true
          echo
          echo "=== MPI .mod files ==="
          find / -name 'mpi.mod' -o -name 'mpi_f08.mod' 2>/dev/null || true
          echo
          echo "=== Preprocessor COMMA macro test ==="
          {
            echo '#define COMMA ,'
            echo '#define DEBUG_WRITE(M) !call foo( M )'
            echo 'program test'
            echo '  implicit none'
            echo '  integer :: n'
            echo '  n = 1'
            echo "  DEBUG_WRITE('hello' COMMA n)"
            echo "  print *, 'OK'"
            echo 'end program test'
          } > /tmp/test_comma.F90
          cat /tmp/test_comma.F90
          echo
          echo "--- ifx (default) ---"
          ifx -free -o /tmp/test1 /tmp/test_comma.F90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "--- ifx -fpp ---"
          ifx -fpp -free -o /tmp/test2 /tmp/test_comma.F90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "--- ifx -no-fpp ---"
          ifx -no-fpp -free -o /tmp/test3 /tmp/test_comma.F90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "--- cpp -traditional-cpp then ifx ---"
          cpp -traditional-cpp -P /tmp/test_comma.F90 > /tmp/test_cpp.f90 2>&1 || true
          cat /tmp/test_cpp.f90
          ifx -free -o /tmp/test4 /tmp/test_cpp.f90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "=== config_env.sh ==="
          cat /container/config_env.sh 2>/dev/null || echo "not found"

  cisldev:
    name: cisldev oneapi-openmpi (reference)
    runs-on: ubuntu-latest
    container:
      image: docker.io/ncarcisl/cisldev-x86_64-almalinux9-oneapi-openmpi:devel
    steps:
      - name: Compiler and preprocessor info
        shell: bash
        run: |
          set +e
          source /container/config_env.sh 2>/dev/null
          echo "=== Intel compiler version ==="
          ifx --version 2>&1 || ifort --version 2>&1 || echo "neither found"
          echo
          echo "=== which ifx/ifort ==="
          which ifx 2>&1; which ifort 2>&1
          echo
          echo "=== mpifort -show ==="
          mpifort -show 2>&1 || true
          echo
          echo "=== mpifort --version ==="
          mpifort --version 2>&1 || true
          echo
          echo "=== MPI .mod files ==="
          find / -name 'mpi.mod' -o -name 'mpi_f08.mod' 2>/dev/null || true
          echo
          echo "=== Preprocessor COMMA macro test ==="
          {
            echo '#define COMMA ,'
            echo '#define DEBUG_WRITE(M) !call foo( M )'
            echo 'program test'
            echo '  implicit none'
            echo '  integer :: n'
            echo '  n = 1'
            echo "  DEBUG_WRITE('hello' COMMA n)"
            echo "  print *, 'OK'"
            echo 'end program test'
          } > /tmp/test_comma.F90
          cat /tmp/test_comma.F90
          echo
          echo "--- ifx (default) ---"
          ifx -free -o /tmp/test1 /tmp/test_comma.F90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "--- ifx -fpp ---"
          ifx -fpp -free -o /tmp/test2 /tmp/test_comma.F90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "--- ifx -no-fpp ---"
          ifx -no-fpp -free -o /tmp/test3 /tmp/test_comma.F90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "--- cpp -traditional-cpp then ifx ---"
          cpp -traditional-cpp -P /tmp/test_comma.F90 > /tmp/test_cpp.f90 2>&1 || true
          cat /tmp/test_cpp.f90
          ifx -free -o /tmp/test4 /tmp/test_cpp.f90 2>&1 && echo "SUCCESS" || echo "FAILED"
          echo
          echo "=== config_env.sh ==="
          cat /container/config_env.sh 2>/dev/null || echo "not found"
