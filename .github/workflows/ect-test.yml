# Ensemble Consistency Test (ECT)
# Runs 3 perturbed MPAS-A simulations on the 120km mesh and compares
# against a pre-built ensemble summary file using PyCECT.
#
# This test detects statistically meaningful changes in model output
# that go beyond internal variability (non-BFB but scientifically equivalent
# changes will pass). Run this on code changes NOT expected to change science.
#
# Reference: Price-Broncucia et al. (2025), doi:10.5194/gmd-18-2349-2025

name: Ensemble Consistency Test (ECT)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  #===========================================================================
  # BUILD
  #===========================================================================
  build:
    name: Build MPAS-A
    runs-on: ubuntu-latest
    container:
      image: ncarcisl/cisldev-x86_64-almalinux9-gcc-openmpi:devel

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Build MPAS-A
        uses: ./.github/actions/build-mpas
        with:
          compiler: gfortran

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-ect
          path: atmosphere_model
          retention-days: 1

  #===========================================================================
  # RUN: 3 perturbed ensemble members
  #===========================================================================
  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        member: [0, 1, 2]

    name: ECT member ${{ matrix.member }}
    runs-on: ubuntu-latest
    container:
      image: ncarcisl/cisldev-x86_64-almalinux9-gcc-openmpi:devel

    steps:
      - uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: exe-ect

      - name: Download test case
        uses: ./.github/actions/download-testdata
        with:
          test-case: ect-120km
          dest-dir: base-case

      - name: Run perturbed MPAS-A
        uses: ./.github/actions/run-perturb-mpas
        with:
          base-dir: base-case
          executable: ./atmosphere_model
          member-start: ${{ matrix.member }}
          member-end: ${{ matrix.member }}

      - name: Upload history file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ect-history-${{ matrix.member }}
          path: history-output/history.*.nc
          retention-days: 1

      - name: Upload log files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ect-logs-${{ matrix.member }}
          path: history-output/log.*.out
          retention-days: 5

  #===========================================================================
  # VALIDATE: Run PyCECT against ensemble summary
  #===========================================================================
  validate:
    needs: run
    if: always()
    name: PyCECT Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyCECT
        run: pip install "numpy<2" scipy netCDF4

      - name: Clone PyCECT
        run: git clone --depth 1 https://github.com/NCAR/PyCECT.git pycect

      - name: Download ensemble summary file
        id: summary
        run: |
          source .github/test-cases/ect-120km/config.env
          SUMMARY="${ECT_SUMMARY_PREFIX}.nc"
          echo "Downloading ${SUMMARY} from ${DATA_REPO}..."
          HTTP_CODE=$(curl -sL -w "%{http_code}" \
            "https://github.com/${DATA_REPO}/raw/main/${SUMMARY}" \
            -o "${SUMMARY}")
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::Ensemble summary file not yet available in ${DATA_REPO} (HTTP ${HTTP_CODE})"
            echo "  The summary file must be generated using the ect-ensemble-gen.yml workflow"
            echo "  and uploaded to ${DATA_REPO} before this test can run."
            echo "available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Downloaded summary file: $(du -h ${SUMMARY})"
          echo "available=true" >> $GITHUB_OUTPUT
          echo "summary-file=${SUMMARY}" >> $GITHUB_OUTPUT
          echo "tslice=${ECT_TSLICE}" >> $GITHUB_OUTPUT

      - name: Download history files
        if: steps.summary.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ect-history-*
          path: ect-test-files
          merge-multiple: true

      - name: List test files
        if: steps.summary.outputs.available == 'true'
        run: |
          echo "=== ECT test history files ==="
          ls -la ect-test-files/ 2>/dev/null || echo "No history files found"

      - name: Run PyCECT
        if: steps.summary.outputs.available == 'true'
        run: |
          # pyCECT always exits 0 — capture output and check for PASSED/FAILED
          set +e
          python pycect/pyCECT.py \
            --sumfile ${{ steps.summary.outputs.summary-file }} \
            --indir ect-test-files \
            --tslice ${{ steps.summary.outputs.tslice }} \
            --mpas \
            --verbose \
            2>&1 | tee pycect_output.txt
          PYCECT_STATUS=$?
          set -e

          if [ $PYCECT_STATUS -ne 0 ]; then
            echo "::error::pyCECT crashed with exit code ${PYCECT_STATUS}"
            exit 1
          fi

          if grep -qF '****PASSED****' pycect_output.txt; then
            echo "::notice::ECT result: PASSED"
          elif grep -qF '****FAILED****' pycect_output.txt; then
            echo "::error::ECT result: FAILED — code changes may have altered model output beyond internal variability"
            exit 1
          else
            echo "::warning::Could not determine ECT result from pyCECT output"
            exit 1
          fi

      - name: Skip notice
        if: steps.summary.outputs.available != 'true'
        run: |
          echo "::notice::ECT validation skipped — ensemble summary file not yet available."
          echo "Run the ect-ensemble-gen.yml workflow to generate it."

  #===========================================================================
  # CLEANUP
  #===========================================================================
  cleanup:
    needs: [run, validate]
    if: always()
    runs-on: ubuntu-latest
    name: Cleanup

    steps:
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: exe-ect
          failOnError: false
