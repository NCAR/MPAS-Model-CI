# Subset CI: validate MPAS's native CMake build (the build path mpas-bundle
# uses for JEDI-MPAS) across all three supported MPAS_COMPILER families —
# gcc (-> gnu), oneapi (-> intel), nvhpc (-> nvhpc) — with OpenMPI.

name: "CMake Build Matrix"

on:
  workflow_dispatch:
  # TEMPORARY while these workflows only exist on a feature branch:
  # workflow_dispatch can't be listed/triggered until the file is on the
  # default branch (master), so a scoped push trigger lets us test it here
  # first. Remove this `push:` block once this is merged to master.
  push:
    branches:
      - 'feature-ci/cmake-build'
    paths:
      - '.github/workflows/test-cmake-matrix.yml'
      - '.github/workflows/_test-cmake.yml'
      - '.github/actions/build-mpas-cmake/**'
      - '.github/ci-config.env'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, oneapi, nvhpc]
    uses: ./.github/workflows/_test-cmake.yml
    with:
      compiler: ${{ matrix.compiler }}
      mpi: openmpi
