# GitHub Actions hosted runners workflow
# Builds all compiler/MPI combinations, runs only nogpu configurations
#
name: (GitHub Actions) Build All, Run NoGPU

on:
  workflow_dispatch:
    branches:
      - master
      - develop

# Container image pattern: ncarcisl/cisldev-x86_64-almalinux9-{compiler}-{mpi}:devel
# MPI flags: openmpi needs --allow-run-as-root --oversubscribe (handled by run-mpas)

jobs:
  #===========================================================================
  # BUILD: All compiler/MPI combinations (nogpu only for GitHub runners)
  #===========================================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, nvhpc, oneapi]
        mpi: [mpich3, openmpi]
        io: [smiol, pio]

    name: Build (${{ matrix.compiler }}, ${{ matrix.mpi }}, ${{ matrix.io }})
    runs-on: ubuntu-latest
    container:
      image: ncarcisl/cisldev-x86_64-almalinux9-${{ matrix.compiler }}-${{ matrix.mpi }}:devel

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Build MPAS-A
        uses: ./.github/actions/build-mpas
        with:
          compiler: ${{ matrix.compiler }}
          use-pio: ${{ matrix.io == 'pio' }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.compiler }}-${{ matrix.mpi }}-nogpu-${{ matrix.io }}
          path: atmosphere_model
          retention-days: 1

  #===========================================================================
  # RUN: NoGPU configurations, 1 and 4 MPI ranks
  #===========================================================================
  run:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        num-procs: [1, 4]
        compiler: [gcc, nvhpc, oneapi]
        mpi: [mpich3, openmpi]
        io: [smiol, pio]

    name: Run ${{ matrix.num-procs }}proc (${{ matrix.compiler }}, ${{ matrix.mpi }}, ${{ matrix.io }})
    runs-on: ubuntu-latest
    container:
      image: ncarcisl/cisldev-x86_64-almalinux9-${{ matrix.compiler }}-${{ matrix.mpi }}:devel

    steps:
      - uses: actions/checkout@v4

      - name: Download executable
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: exe-${{ matrix.compiler }}-${{ matrix.mpi }}-nogpu-${{ matrix.io }}

      - name: Run MPAS-A
        if: steps.download.outcome == 'success'
        uses: ./.github/actions/run-mpas
        with:
          executable: ./atmosphere_model
          num-procs: ${{ matrix.num-procs }}
          mpi-impl: ${{ matrix.mpi == 'mpich3' && 'mpich' || 'openmpi' }}
          working-dir: run-${{ matrix.num-procs }}proc-${{ matrix.compiler }}-${{ matrix.mpi }}-${{ matrix.io }}

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always() && steps.download.outcome == 'success'
        with:
          name: logs-${{ matrix.num-procs }}proc-${{ matrix.compiler }}-${{ matrix.mpi }}-nogpu-${{ matrix.io }}
          path: run-${{ matrix.num-procs }}proc-${{ matrix.compiler }}-${{ matrix.mpi }}-${{ matrix.io }}/log.*
          retention-days: 5

  #===========================================================================
  # VALIDATE: Compare logs against reference and across MPI ranks
  #===========================================================================
  validate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    name: Validate Results

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all logs
        uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs

      - name: Generate expected config lists
        id: expected
        shell: bash
        run: |
          COMPILERS=(gcc nvhpc oneapi)
          MPIS=(mpich3 openmpi)
          IOS=(smiol pio)

          REF_LIST=""
          DECOMP_LIST=""
          for compiler in "${COMPILERS[@]}"; do
            for mpi in "${MPIS[@]}"; do
              for io in "${IOS[@]}"; do
                REF_LIST="${REF_LIST:+${REF_LIST},}logs-1proc-${compiler}-${mpi}-nogpu-${io}"
                DECOMP_LIST="${DECOMP_LIST:+${DECOMP_LIST},}4proc vs 1proc: ${compiler}-${mpi}-nogpu-${io}"
              done
            done
          done

          echo "ref=${REF_LIST}" >> $GITHUB_OUTPUT
          echo "decomp=${DECOMP_LIST}" >> $GITHUB_OUTPUT

      - name: Validate 1-proc logs against reference
        uses: ./.github/actions/validate-logs
        with:
          logs-path: logs
          log-filter: 1proc
          reference-log: .github/test-cases/240km/reference_log.atmosphere.0000.out
          expected-configs: ${{ steps.expected.outputs.ref }}

      - name: Decomposition test — compare 4-proc logs against 1-proc logs
        shell: bash
        run: |
          python .github/actions/validate-logs/compare_logs.py \
            logs \
            --decomposition-test \
            --allow-missing \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --expected "${{ steps.expected.outputs.decomp }}"

  #===========================================================================
  # ECT RUN: 3 perturbed ensemble members per matrix combination (120km)
  #===========================================================================
  ect-run:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        member: [0, 1, 2]
        compiler: [gcc, nvhpc, oneapi]
        mpi: [mpich3, openmpi]
        io: [smiol, pio]
        num-procs: [1, 4]

    name: ECT ${{ matrix.num-procs }}proc member ${{ matrix.member }} (${{ matrix.compiler }}, ${{ matrix.mpi }}, ${{ matrix.io }})
    runs-on: ubuntu-latest
    container:
      image: ncarcisl/cisldev-x86_64-almalinux9-${{ matrix.compiler }}-${{ matrix.mpi }}:devel

    steps:
      - uses: actions/checkout@v4

      - name: Download executable
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: exe-${{ matrix.compiler }}-${{ matrix.mpi }}-nogpu-${{ matrix.io }}

      - name: Download test case
        if: steps.download.outcome == 'success'
        uses: ./.github/actions/download-testdata
        with:
          test-case: ect-120km
          dest-dir: base-case

      - name: Download spin-up restart
        if: steps.download.outcome == 'success'
        id: restart
        shell: bash
        run: |
          source .github/test-cases/ect-120km/config.env
          RESTART="${ECT_SUMMARY_PREFIX}_restart.nc"
          echo "Downloading ${RESTART} from ${DATA_REPO}..."
          HTTP_CODE=$(curl -sL --retry 5 --retry-delay 5 -w "%{http_code}" \
            "https://github.com/${DATA_REPO}/raw/main/${RESTART}" \
            -o "${RESTART}")
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "Downloaded restart: $(du -h ${RESTART})"
            echo "available=true" >> $GITHUB_OUTPUT
            echo "file=${RESTART}" >> $GITHUB_OUTPUT
          else
            echo "::warning::Spin-up restart not available (HTTP ${HTTP_CODE}), running from cold-start init.nc"
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run perturbed MPAS-A
        if: steps.download.outcome == 'success'
        uses: ./.github/actions/run-perturb-mpas
        with:
          base-dir: base-case
          executable: ./atmosphere_model
          member-start: ${{ matrix.member }}
          member-end: ${{ matrix.member }}
          num-ranks: ${{ matrix.num-procs }}
          mpi-impl: ${{ matrix.mpi == 'mpich3' && 'mpich' || 'openmpi' }}
          restart-file: ${{ steps.restart.outputs.available == 'true' && steps.restart.outputs.file || '' }}

      - name: Upload history file
        uses: actions/upload-artifact@v4
        if: always() && steps.download.outcome == 'success'
        with:
          name: ect-history-${{ matrix.compiler }}-${{ matrix.mpi }}-${{ matrix.io }}-${{ matrix.num-procs }}proc-member${{ matrix.member }}
          path: history-output/history.*.nc
          retention-days: 1

  #===========================================================================
  # ECT VALIDATE: PyCECT validation per matrix combination
  #===========================================================================
  ect-validate:
    needs: ect-run
    if: always() && needs.ect-run.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, nvhpc, oneapi]
        mpi: [mpich3, openmpi]
        io: [smiol, pio]
        num-procs: [1, 4]

    name: ECT Validate ${{ matrix.num-procs }}proc (${{ matrix.compiler }}, ${{ matrix.mpi }}, ${{ matrix.io }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyCECT dependencies
        run: pip install "numpy<2" scipy netCDF4

      - name: Clone PyCECT
        run: git clone --depth 1 https://github.com/NCAR/PyCECT.git pycect

      - name: Download ensemble summary file
        id: summary
        run: |
          source .github/test-cases/ect-120km/config.env
          SUMMARY="${ECT_SUMMARY_PREFIX}.nc"
          echo "Downloading ${SUMMARY} from ${DATA_REPO}..."
          HTTP_CODE=$(curl -sL -w "%{http_code}" \
            "https://github.com/${DATA_REPO}/raw/main/${SUMMARY}" \
            -o "${SUMMARY}")
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::Ensemble summary file not yet available in ${DATA_REPO} (HTTP ${HTTP_CODE})"
            echo "available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Downloaded summary file: $(du -h ${SUMMARY})"
          echo "available=true" >> $GITHUB_OUTPUT
          echo "summary-file=${SUMMARY}" >> $GITHUB_OUTPUT
          echo "tslice=${ECT_TSLICE}" >> $GITHUB_OUTPUT

      - name: Download history files
        if: steps.summary.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ect-history-${{ matrix.compiler }}-${{ matrix.mpi }}-${{ matrix.io }}-${{ matrix.num-procs }}proc-*
          path: ect-test-files
          merge-multiple: true

      - name: List test files
        if: steps.summary.outputs.available == 'true'
        run: |
          echo "=== ECT test history files ==="
          ls -la ect-test-files/ 2>/dev/null || echo "No history files found"

      - name: Run PyCECT
        if: steps.summary.outputs.available == 'true'
        run: |
          set +e
          python pycect/pyCECT.py \
            --sumfile ${{ steps.summary.outputs.summary-file }} \
            --indir ect-test-files \
            --tslice ${{ steps.summary.outputs.tslice }} \
            --mpas \
            --verbose \
            2>&1 | tee pycect_output.txt
          PYCECT_STATUS=$?
          set -e

          if [ $PYCECT_STATUS -ne 0 ]; then
            echo "::error::pyCECT crashed with exit code ${PYCECT_STATUS}"
            exit 1
          fi

          if grep -qF '****PASSED****' pycect_output.txt; then
            echo "::notice::ECT (${{ matrix.compiler }}/${{ matrix.mpi }}/${{ matrix.io }}/${{ matrix.num-procs }}proc): PASSED"
          elif grep -qF '****FAILED****' pycect_output.txt; then
            echo "::error::ECT (${{ matrix.compiler }}/${{ matrix.mpi }}/${{ matrix.io }}/${{ matrix.num-procs }}proc): FAILED"
            exit 1
          else
            echo "::warning::Could not determine ECT result from pyCECT output"
            exit 1
          fi

      - name: Skip notice
        if: steps.summary.outputs.available != 'true'
        run: |
          echo "::notice::ECT validation skipped — ensemble summary file not yet available."

  #===========================================================================
  # CLEANUP: Remove executable artifacts
  #===========================================================================
  cleanup:
    needs: [run, validate, ect-run, ect-validate]
    if: always()
    runs-on: ubuntu-latest
    name: Cleanup

    steps:
      - name: Delete executable artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            exe-*
            ect-history-*
          failOnError: false
