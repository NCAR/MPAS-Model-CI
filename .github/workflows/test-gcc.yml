# Subset CI: GCC compiler only
# Quick validation that GCC builds and runs correctly.
# For full matrix testing, see test-ga-nogpu.yml.

name: "GCC (subset)"

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    uses: ./.github/workflows/_test-compiler.yml
    with:
      compiler: gcc
