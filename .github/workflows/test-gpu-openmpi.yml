# Subset CI: NVHPC + OpenMPI (GPU vs CPU)
# Runs on CIRRUS self-hosted runners with GPU access.
# Known issue: NVHPC+OpenMPI SIGABRT.
# workflow_dispatch only — no push/pull_request (self-hosted security).

name: "NVHPC+OpenMPI (GPU)"

on:
  workflow_dispatch:
    inputs:
      gpu_aware_mpi:
        description: 'Use GPU-aware MPI halo exchanges on the GPU (OpenACC) runs. Needs CUDA-enabled MPI in the container; set false to fall back to host-staged halos.'
        required: false
        type: boolean
        default: true

jobs:
  test:
    uses: ./.github/workflows/_test-gpu.yml
    with:
      gpu-aware-mpi: ${{ inputs.gpu_aware_mpi }}
      mpi: openmpi

