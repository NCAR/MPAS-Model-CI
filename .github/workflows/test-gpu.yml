# Subset CI: GPU vs CPU comparison (NVHPC/MPICH/SMIOL)
# Builds and runs MPAS-A in both CUDA and NoGPU modes on CIRRUS
# self-hosted runners with GPU access, then compares logs.
#
# Security: This workflow runs on self-hosted CIRRUS runners. Only trigger
# via workflow_dispatch by trusted maintainers — never on pull_request,
# which could allow fork PRs to execute arbitrary code on CIRRUS hardware.
#
# For full NVHPC GPU matrix, see test-cirrus-nvhpc.yml.

name: "GPU (subset)"

on:
  workflow_dispatch:

jobs:
  config:
    name: Resolve Config
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.container.outputs.container-prefix }}
      image-suffix: ${{ steps.container.outputs.container-suffix }}
      image-gpu-suffix: ${{ steps.container.outputs.container-gpu-suffix }}
      compiler-name: ${{ steps.container.outputs.compiler-name }}
      mpi-name: ${{ steps.container.outputs.mpi-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/resolve-container
        id: container
        with:
          compiler: nvhpc
          mpi: mpich

  build:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        gpu: [nogpu, cuda]

    name: Build (${{ matrix.gpu }})
    runs-on:
      group: CIRRUS-4x8-gpu
    container:
      image: ${{ needs.config.outputs.image-prefix }}-${{ needs.config.outputs.compiler-name }}-${{ needs.config.outputs.mpi-name }}${{ matrix.gpu == 'cuda' && needs.config.outputs.image-gpu-suffix || needs.config.outputs.image-suffix }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Build MPAS-A
        uses: ./.github/actions/build-mpas
        with:
          compiler: nvhpc
          use-pio: 'false'
          openacc: ${{ matrix.gpu == 'cuda' }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-gpu-${{ matrix.gpu }}
          path: atmosphere_model
          retention-days: 1

  run:
    needs: [config, build]
    if: ${{ !cancelled() && needs.build.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        gpu: [nogpu, cuda]

    name: Run (${{ matrix.gpu }})
    runs-on:
      group: CIRRUS-4x8-gpu
    container:
      image: ${{ needs.config.outputs.image-prefix }}-${{ needs.config.outputs.compiler-name }}-${{ needs.config.outputs.mpi-name }}${{ matrix.gpu == 'cuda' && needs.config.outputs.image-gpu-suffix || needs.config.outputs.image-suffix }}

    steps:
      - uses: actions/checkout@v4

      - name: Check GPU availability
        if: matrix.gpu == 'cuda'
        run: |
          echo "=== GPU Information ==="
          nvidia-smi || echo "WARNING: nvidia-smi failed"

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: exe-gpu-${{ matrix.gpu }}

      - name: Run MPAS-A
        uses: ./.github/actions/run-mpas
        with:
          executable: ./atmosphere_model
          num-procs: '1'
          mpi-impl: mpich
          working-dir: run-${{ matrix.gpu }}

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-1proc-nvhpc-mpich-${{ matrix.gpu }}-smiol
          path: run-${{ matrix.gpu }}/log.*
          retention-days: 5

  validate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    name: Validate Results

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all logs
        uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: logs

      - name: Validate logs against reference
        uses: ./.github/actions/validate-logs
        with:
          logs-path: logs
          log-filter: 1proc
          reference-log: .github/test-cases/240km/reference_log.atmosphere.0000.out
          allow-missing: 'false'
          expected-configs: >-
            logs-1proc-nvhpc-mpich-nogpu-smiol,
            logs-1proc-nvhpc-mpich-cuda-smiol

  cleanup:
    needs: [run, validate]
    if: always()
    runs-on: ubuntu-latest
    name: Cleanup

    steps:
      - name: Delete temporary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --paginate --jq '.artifacts[] | select(.name | startswith("exe-")) | .id' \
          | while read id; do
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
            done
